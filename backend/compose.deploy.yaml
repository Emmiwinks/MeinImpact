services:
  api:
    image: ${MEINIMPACT_BACKEND_IMAGE:?Set MEINIMPACT_BACKEND_IMAGE to the GitLab registry image tag}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MEINIMPACT_ENVIRONMENT: ${MEINIMPACT_ENVIRONMENT:-production}
      MEINIMPACT_DATABASE_URL: ${MEINIMPACT_DATABASE_URL:?Set MEINIMPACT_DATABASE_URL}
      MEINIMPACT_JWT_SECRET: ${MEINIMPACT_JWT_SECRET:?Set MEINIMPACT_JWT_SECRET}
      MEINIMPACT_JWT_ISSUER: ${MEINIMPACT_JWT_ISSUER:-meinimpact-api}
      MEINIMPACT_JWT_AUDIENCE: ${MEINIMPACT_JWT_AUDIENCE:-meinimpact-app}
      MEINIMPACT_ACCESS_TOKEN_MINUTES: ${MEINIMPACT_ACCESS_TOKEN_MINUTES:-15}
      MEINIMPACT_MISTRAL_API_KEY: ${MEINIMPACT_MISTRAL_API_KEY:?Set MEINIMPACT_MISTRAL_API_KEY}
      MEINIMPACT_MISTRAL_MODEL: ${MEINIMPACT_MISTRAL_MODEL:-mistral-small-latest}
      MEINIMPACT_MISTRAL_BASE_URL: ${MEINIMPACT_MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MEINIMPACT_ALLOWED_ORIGINS: ${MEINIMPACT_ALLOWED_ORIGINS:?Set MEINIMPACT_ALLOWED_ORIGINS as a JSON array}
    ports:
      - "${MEINIMPACT_API_PORT:-8000}:8000"

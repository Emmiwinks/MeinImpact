app = "meinimpact-api"
primary_region = "fra"

[build]

[deploy]
  release_command = "python -m alembic upgrade head"

[env]
  MEINIMPACT_ENVIRONMENT = "production"
  MEINIMPACT_ALLOWED_ORIGINS = '["https://meinimpact.de","https://www.meinimpact.de","https://meinimpact.com","https://app.meinimpact.de"]'
  MEINIMPACT_INGESTION_SCHEDULER_ENABLED = "true"
  MEINIMPACT_IMPACT_NEWS_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # Ingestion runs in the background for up to ~30 min after the request
  # that started it, and the scheduler lives in the app; a machine stopped
  # for idleness would kill both.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

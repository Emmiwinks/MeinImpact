<meta content="Die Bundesregierung will beim Wohngeld ab 2027 bis zu 2,1 Milliarden Euro jährlich kürzen. Rund 380.000 Haushalte würden ihren Anspruch verlieren, alle anderen bekämen weniger. Betroffen sind vor allem Familien mit Kindern, Rentner*innen, Alleinerziehende und Haushalte mit kleinem Einkommen. Bei steigenden Mieten droht durch die Kürzungen ein Anstieg der Wohnungslosigkeit, so der Mieterbund. Über 50.000 Menschen fordern bereits: Keine Kürzungen beim Wohngeld! Unterschreibe jetzt die WeAct-Petition." property="description">

services:
  api:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      MEINIMPACT_DATABASE_URL: postgresql+asyncpg://meinimpact:meinimpact@db:5432/meinimpact
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "meinimpact.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    # pgvector-enabled image (plain postgres:17-alpine has no `vector`
    # extension) — needed for opportunities.embedding.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: meinimpact
      POSTGRES_USER: meinimpact
      POSTGRES_PASSWORD: meinimpact
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meinimpact -d meinimpact"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

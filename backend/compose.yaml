services:
  api:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      MEINIMPACT_DATABASE_URL: postgresql+psycopg://meinimpact:meinimpact@db:5432/meinimpact
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meinimpact
      POSTGRES_USER: meinimpact
      POSTGRES_PASSWORD: meinimpact
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meinimpact -d meinimpact"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

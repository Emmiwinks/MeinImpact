[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meinimpact-backend"
version = "0.1.1"
description = "FastAPI backend for MeinImpact."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "APScheduler>=3.11,<4",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langdetect>=1.0.9",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "thefuzz>=0.22",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "types-PyJWT>=1.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=meinimpact --cov-report=term-missing --cov-fail-under=80 -m 'not live'"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits the real external API, excluded from the default test run"]

[tool.coverage.run]
branch = true
source = ["meinimpact"]
data_file = "/tmp/.coverage"

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"src/meinimpact/infrastructure/push/postgres_push_repository.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = []

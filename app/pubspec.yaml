name: meinimpact
description: Cross-platform civic action assistant.
publish_to: none
version: 0.1.2+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_email_sender: ^11.2.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  intl: any
  url_launcher: ^6.3.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  # Bundled, never fetched at runtime (no request to Google per user).
  # Licences: assets/fonts/*-OFL.txt, registered in main.dart.
  assets:
    - assets/fonts/Unbounded-OFL.txt
    - assets/fonts/AlbertSans-OFL.txt
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-ExtraBold.ttf
          weight: 800
    - family: AlbertSans
      fonts:
        - asset: assets/fonts/AlbertSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlbertSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AlbertSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/AlbertSans-ExtraBold.ttf
          weight: 800

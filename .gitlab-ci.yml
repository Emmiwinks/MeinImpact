stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"

backend:test:
  stage: test
  image: python:3.14-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: meinimpact
    POSTGRES_USER: meinimpact
    POSTGRES_PASSWORD: meinimpact
    MEINIMPACT_DATABASE_URL: postgresql+asyncpg://meinimpact:meinimpact@postgres:5432/meinimpact
    MEINIMPACT_JWT_SECRET: ci-test-secret
  cache:
    key: "$CI_COMMIT_REF_SLUG-backend-pip"
    paths:
      - .cache/pip
  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  script:
    - ruff format --check .
    - ruff check .
    - mypy src tests
    - |
      python - <<'PY'
      import asyncio
      import os

      import asyncpg

      async def main() -> None:
          database_url = os.environ["MEINIMPACT_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          last_error: Exception | None = None
          for _ in range(30):
              try:
                  connection = await asyncpg.connect(database_url)
                  await connection.close()
                  return
              except Exception as error:
                  last_error = error
                  await asyncio.sleep(1)
          raise RuntimeError("PostgreSQL did not become ready") from last_error

      asyncio.run(main())
      PY
    - python -m alembic upgrade head
    - pytest
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

backend:image:
  stage: build
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - backend:test
  script:
    - docker build --pull -t "$BACKEND_IMAGE:$CI_COMMIT_SHA" backend
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$BACKEND_IMAGE:$CI_COMMIT_SHA"

        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          docker tag "$BACKEND_IMAGE:$CI_COMMIT_SHA" "$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG"
          docker tag "$BACKEND_IMAGE:$CI_COMMIT_SHA" "$BACKEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG"
          docker push "$BACKEND_IMAGE:latest"
        fi

        if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag "$BACKEND_IMAGE:$CI_COMMIT_SHA" "$BACKEND_IMAGE:$CI_COMMIT_TAG"
          docker push "$BACKEND_IMAGE:$CI_COMMIT_TAG"
        fi
      fi
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

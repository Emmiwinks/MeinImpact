name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: meinimpact
          POSTGRES_USER: meinimpact
          POSTGRES_PASSWORD: meinimpact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meinimpact -d meinimpact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src tests

      - name: Run database migrations
        env:
          MEINIMPACT_DATABASE_URL: postgresql+asyncpg://meinimpact:meinimpact@localhost:5432/meinimpact
        run: python -m alembic upgrade head

      - name: Run tests
        env:
          MEINIMPACT_DATABASE_URL: postgresql+asyncpg://meinimpact:meinimpact@localhost:5432/meinimpact
          MEINIMPACT_JWT_SECRET: ci-test-secret
        run: pytest

  image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t meinimpact-backend:ci backend

name: App

on:
  pull_request:
    paths:
      - "app/**"
      - "tools/**"
      - ".github/workflows/app.yml"
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "tools/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android is committed; flutter create must not touch it
      - name: Generate platform folders
        run: flutter create --platforms=ios,web,windows,macos,linux .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Enforce coverage
        run: python ../tools/check_lcov.py coverage/lcov.info 35

  android:
    # A signed app bundle for Google Play on every push to main (upload it in
    # the Play Console); pull requests only check that it builds.
    name: Build Android release
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Without the key, release builds fall back to the debug key, which
      # Play rejects: fail here instead of producing an unusable bundle.
      - name: Write the upload key
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # The build number must grow with every upload to Play
      - name: Build app bundle
        run: >-
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=MEINIMPACT_API_BASE_URL=https://meinimpact-api.fly.dev/

      - name: Upload app bundle
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meinimpact-android-${{ github.run_number }}
          path: app/build/app/outputs/bundle/release/app-release.aab

  web:
    name: Build web app
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web project
        run: flutter create --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build web release
        # api.meinimpact.de's DNS was never finished (CNAME not resolving) —
        # pointing at the working fly.dev URL directly until that's fixed.
        run: flutter build web --release --pwa-strategy=none --dart-define=MEINIMPACT_API_BASE_URL=https://meinimpact-api.fly.dev/

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/build/web --project-name=meinimpact --branch=main

  linux:
    name: Build Linux app
    if: false
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux project
        run: flutter create --platforms=linux .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Linux debug bundle
        run: flutter build linux --debug

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug
          path: app/build/linux

  windows:
    name: Build Windows app
    if: false
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows debug bundle
        run: flutter build windows --debug

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug
          path: app/build/windows

  apple:
    name: Build Apple apps
    if: false
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Apple projects
        run: flutter create --platforms=ios,macos .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign

      - name: Build macOS release
        run: flutter build macos --release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: app/build/macos
